# Project Identification
sonar.projectKey=Shahil-Ahamad-Per_Portfolio
sonar.projectName=Shahil Ahamad Portfolio
sonar.projectVersion=0.1.0

# Source and Test Inclusions
sonar.sources=app,components,hooks,lib
sonar.tests=app,components,hooks,lib
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**
sonar.exclusions=node_modules/**,.next/**,coverage/**,public/**,.vercel/**,**/*.d.ts

# Code Coverage Integration (Vitest lcov report)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encodings & Environment
sonar.sourceEncoding=UTF-8
